<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papai Noel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo e mágico, para ficar horas num monitor
   IDEA: o Papai Noel olhando do céu de uma noite de Natal
   PICTURE: o rosto grande no centro, respirando, piscando; de 10 em 10 minutos ele fala
   COLOUR and TYPE: azul-noite profundo, estrelas brancas e douradas, balão branco; Mountains of Christmas
   LAYOUT: tela cheia; rosto fixo no centro, balão flutua por cima sem mover nada */
:root{color-scheme:dark;--n1:#050a1f;--n2:#0e1f4d;--gold:#ffd166;--red:#c1121f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--n1)}
body{font-family:Nunito,system-ui,sans-serif}
body.hide-cursor{cursor:none}
.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,var(--n2) 0%,var(--n1) 75%)}
#sky{position:absolute;inset:0;width:100%;height:100%}
.halo{position:absolute;left:50%;top:50%;width:min(110vh,120vw);aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,140,.22) 0%,rgba(255,220,140,.08) 40%,transparent 68%);animation:halo 6s ease-in-out infinite}
@keyframes halo{50%{opacity:.6;scale:.94}}

.santa{position:absolute;left:50%;top:50%;height:min(84vh,100vw);aspect-ratio:704/760;translate:-50% -50%}
.santa svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
#head{transform-origin:352px 700px;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg) scale(1)}25%{transform:rotate(0deg) scale(1.012)}50%{transform:rotate(1.6deg) scale(1)}75%{transform:rotate(0deg) scale(1.012)}}
body.laugh #head{animation:laugh .34s ease-in-out infinite}
@keyframes laugh{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-16px) rotate(1.2deg)}}

/* o balão é sobreposto: o rosto não se mexe para ele aparecer */
.bubble{position:absolute;left:86%;top:24%;width:max-content;max-width:min(34vw,560px);z-index:3;
  background:#fff;color:#8e1b1b;border-radius:36px;padding:clamp(14px,2.4vh,32px) clamp(20px,2.6vw,42px);
  box-shadow:0 14px 40px rgba(0,0,0,.45);transform-origin:0% 70%;
  opacity:0;transform:scale(.4);transition:opacity .35s,transform .45s cubic-bezier(.2,1.5,.4,1)}
.bubble.show{opacity:1;transform:none}
.bubble::before{content:"";position:absolute;left:-30px;bottom:26%;border:18px solid transparent;border-right:36px solid #fff;border-left:0}
.bubble p{text-align:center;font-family:"Mountains of Christmas",Georgia,serif;font-weight:700;font-size:clamp(28px,4.6vh,76px);line-height:1.08;text-wrap:balance}
.bubble.ho p{color:var(--red);font-size:clamp(40px,8vh,120px);white-space:nowrap}

@media (max-aspect-ratio:1/1){
  .santa{height:auto;width:min(92vw,70vh);top:52%}
  .bubble{left:50%;top:auto;bottom:100%;translate:-50% -4%;max-width:86vw;transform-origin:50% 100%}
  .bubble::before{left:50%;bottom:-30px;margin-left:-18px;border:18px solid transparent;border-top:36px solid #fff;border-bottom:0}
}

.ctrl{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;transition:opacity .6s}
.ctrl button{font:800 15px Nunito,system-ui,sans-serif;color:#0b1a3a;background:var(--gold);border:0;border-radius:999px;padding:12px 20px;min-height:44px;cursor:pointer}
.ctrl button[aria-pressed=true]{background:#fff}
.ctrl button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ctrl span{font-size:13px;color:rgba(255,255,255,.55)}
body.hide-cursor .ctrl{opacity:0}
</style>
</head>

    <div class="bubble" id="bubble" aria-live="polite"><p><span id="text"></span><span id="rest" style="visibility:hidden"></span></p></div>

  <div class="ctrl">
    <button id="voice" type="button" aria-pressed="false">Ativar voz</button>
    <span>Clique na tela para tela cheia</span>
  </div>
</div>

<script>
{
  // ===== Ajustes =====
  const INTERVALO_MINUTOS = 10;      // de quanto em quanto tempo ele fala
  const PRIMEIRA_FALA_SEGUNDOS = 5;  // primeira fala logo depois de abrir a página
  const FRASES = [
    'Feliz Natal!',
    'Você se comportou bem este ano?',
    'Boas festas para você e sua família!',
    'Já escreveu sua cartinha?',
    'Que a magia do Natal ilumine sua casa!',
    'As renas estão prontas para voar!',
    'Paz, amor e alegria neste Natal!',
    'Não esqueça do leite com biscoitos!',
    'Um próspero Ano Novo!',
    'O melhor presente é estar junto de quem amamos.'
  ];
  // ====================

  const $ = s => document.querySelector(s);
  const body = document.body, bubble = $('#bubble'), text = $('#text'), rest = $('#rest'), jaw = $('#jaw');
  const lids = [...document.querySelectorAll('.lid')].map(r => ({r, l:r.nextElementSibling, top:+r.getAttribute('y')}));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---- voz opcional (o navegador só libera som depois de um clique)
  const synth = window.speechSynthesis;
  let voiceOn = false, voice = null;
  const pick = () => { try { const v = synth.getVoices(); voice = v.find(x=>/pt-BR/i.test(x.lang)) || v.find(x=>/^pt/i.test(x.lang)) || null; } catch(e){} };
  if (synth){ pick(); try { synth.addEventListener('voiceschanged', pick); } catch(e){} }
  const vb = $('#voice');
  if (!synth) vb.hidden = true;
  vb.addEventListener('click', e => {
    e.stopPropagation();
    voiceOn = !voiceOn;
    vb.setAttribute('aria-pressed', voiceOn);
    vb.textContent = voiceOn ? 'Voz ligada' : 'Ativar voz';
    if (!voiceOn) try { synth.cancel(); } catch(e){}
  });
  function speak(s){
    if (!voiceOn) return;
    try {
      const u = new SpeechSynthesisUtterance(s.replace(/Ho ho ho/gi,'Rô, rô, rô'));
      u.lang = 'pt-BR'; if (voice) u.voice = voice; u.pitch = .55; u.rate = .92;
      synth.cancel(); synth.speak(u);
    } catch(e){}
  }

  // ---- fala
  let mode = 'idle';  // idle | talk | laugh
  async function line(s, ho){
    bubble.classList.toggle('ho', ho);
    text.textContent = ''; rest.textContent = s;
    bubble.classList.add('show');
    mode = ho ? 'laugh' : 'talk';
    body.classList.toggle('laugh', ho);
    speak(s);
    for (let i=1;i<=s.length;i++){ text.textContent = s.slice(0,i); rest.textContent = s.slice(i); await wait(ho ? 110 : 55); }
    await wait(ho ? 500 : 300);
    mode = 'idle'; body.classList.remove('laugh');
    await wait(ho ? 1300 : 3500);
  }
  let order = [];
  async function speech(){
    if (!order.length) order = FRASES.slice().sort(() => Math.random() - .5);
    await line('Ho ho ho!', true);
    await line(order.pop(), false);
    bubble.classList.remove('show');
  }
  (async () => {
    await wait(PRIMEIRA_FALA_SEGUNDOS * 1000);
    for(;;){ await speech(); await wait(INTERVALO_MINUTOS * 60000); }
  })();

  // ---- céu estrelado
  const cv = $('#sky'), c = cv.getContext('2d');
  let W=0,H=0,stars=[],sparkles=[],meteor=null,nextMeteor=performance.now()+6000;
  function resize(){
    const d = Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*d; cv.height=H*d; c.setTransform(d,0,0,d,0,0);
    stars = Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.4+Math.random()*1.6}));
    sparkles = Array.from({length:Math.max(8,Math.round(W*H/90000))},()=>({x:Math.random()*W,y:Math.random()*H,r:6+Math.random()*10,p:Math.random()*6.28,s:.5+Math.random(),g:Math.random()<.5}));
  }
  resize(); addEventListener('resize', resize);
  function sparkle(x,y,r,a,gold){
    c.globalAlpha = a; c.fillStyle = gold ? '#ffe7a3' : '#ffffff';
    c.beginPath(); c.moveTo(x,y-r); c.quadraticCurveTo(x,y,x+r*.35,y); c.quadraticCurveTo(x,y,x,y+r); c.quadraticCurveTo(x,y,x-r*.35,y); c.quadraticCurveTo(x,y,x,y-r); c.fill();
    c.beginPath(); c.moveTo(x-r*.7,y); c.quadraticCurveTo(x,y,x,y-r*.25); c.quadraticCurveTo(x,y,x+r*.7,y); c.quadraticCurveTo(x,y,x,y+r*.25); c.quadraticCurveTo(x,y,x-r*.7,y); c.fill();
    c.beginPath(); c.arc(x,y,r*.18,0,6.283); c.fill();
  }

  // ---- piscar e falar
  let last = performance.now(), t = 0, open = 0, nextBlink = last + 2000, blinkAt = -1;
  function frame(now){
    const dt = Math.min((now-last)/1000,.05); last = now; t += dt;

    c.clearRect(0,0,W,H);
    c.fillStyle = '#fff';
    for (const s of stars){ c.globalAlpha = .3 + .7*Math.sin(t*s.s+s.p)**2; c.beginPath(); c.arc(s.x,s.y,s.r,0,6.283); c.fill(); }
    for (const s of sparkles){ const k = .5+.5*Math.sin(t*s.s+s.p); sparkle(s.x,s.y,s.r*(.6+.4*k),.35+.65*k,s.g); }
    if (!meteor && now > nextMeteor){ meteor = {x:Math.random()*W*.6, y:Math.random()*H*.3, vx:W*.55, vy:H*.22, life:1}; }
    if (meteor){
      meteor.x += meteor.vx*dt; meteor.y += meteor.vy*dt; meteor.life -= dt*1.1;
      const g = c.createLinearGradient(meteor.x-120,meteor.y-48,meteor.x,meteor.y);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,'+Math.max(0,meteor.life)+')');
      c.globalAlpha = 1; c.strokeStyle = g; c.lineWidth = 2; c.beginPath(); c.moveTo(meteor.x-120,meteor.y-48); c.lineTo(meteor.x,meteor.y); c.stroke();
      if (meteor.life <= 0){ meteor = null; nextMeteor = now + 8000 + Math.random()*12000; }
    }
    c.globalAlpha = 1;

    // boca
    let target = 0;
    if (mode === 'laugh') target = .55 + .45*Math.abs(Math.sin(now/100));
    else if (mode === 'talk') target = .15 + .85*Math.abs(Math.sin(now/72)*Math.sin(now/181));
    open += (target-open)*Math.min(1,dt*18);
    jaw.setAttribute('transform', `translate(0 ${(open*22).toFixed(2)})`);

    // piscar
    if (now > nextBlink && blinkAt < 0) blinkAt = now;
    let lid = 0;
    if (blinkAt >= 0){
      const k = (now-blinkAt)/170;
      lid = k < .5 ? k*2 : 2-k*2;
      if (k >= 1){ blinkAt = -1; lid = 0; nextBlink = now + (Math.random()<.2 ? 200 : 2500 + Math.random()*3500); }
    }
    for (const o of lids){
      const h = lid*70;
      o.r.setAttribute('height', h.toFixed(1));
      o.l.setAttribute('y1', (o.top+h).toFixed(1)); o.l.setAttribute('y2', (o.top+h).toFixed(1));
      o.l.setAttribute('opacity', lid > .05 ? 1 : 0);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- tela cheia, cursor escondido, tela sempre ligada
  document.addEventListener('click', () => {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
      else document.exitFullscreen?.().catch(()=>{});
    } catch(e){}
  });
  let idle;
  const wake = () => { body.classList.remove('hide-cursor'); clearTimeout(idle); idle = setTimeout(()=>body.classList.add('hide-cursor'), 3000); };
  addEventListener('mousemove', wake); wake();
  const lock = async () => { try { await navigator.wakeLock?.request('screen'); } catch(e){} };
  lock(); document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
}
</script>
</body>
